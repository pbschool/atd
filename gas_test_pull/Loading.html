<!DOCTYPE html>
<html>
<head>
  <style>
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      width: 70%;
      text-align: center;
    }

    #loading-text {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .loading-animation {
      animation: colorChange 1s infinite alternate;
    }

    @keyframes colorChange {
      0% { color: #FF0000; }
      50% { color: #0000FF; }
      100% { color: #32CD32; }
    }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-content">
      <div id="loading-text" class="loading-animation">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <script>
    // เรียกฟังก์ชัน Apps Script เพื่อประมวลผลข้อมูล
    google.script.run
      .withSuccessHandler(() => {
        google.script.host.close();         // ปิด modal
        google.script.run.toastDone();      // แสดงข้อความ Toast
      })
      .Ad_reMonthWork(); // ทำงานโหลดข้อมูลจริง
  </script>

</body>
</html>
